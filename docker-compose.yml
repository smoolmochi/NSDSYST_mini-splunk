x-restart-policy: &restart-policy
  restart: unless-stopped

networks:
  minisplunk-net:
    driver: bridge

volumes:
  configsvr1_data:
  configsvr2_data:
  configsvr3_data:
  shard1a_data:
  shard1b_data:
  shard1c_data:
  shard2a_data:
  shard2b_data:
  shard2c_data:
  rabbitmq_data:

services:
  # ---------------------------------------------------------------
  # Config server replica set (csrs) - metadata for the sharded cluster
  # ---------------------------------------------------------------
  configsvr1:
    image: mongo:7.0
    <<: *restart-policy
    command: ["mongod", "--configsvr", "--replSet", "csrs", "--port", "27019", "--bind_ip_all", "--dbpath", "/data/db"]
    volumes:
      - configsvr1_data:/data/db
    networks: [minisplunk-net]
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27019", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  configsvr2:
    image: mongo:7.0
    <<: *restart-policy
    command: ["mongod", "--configsvr", "--replSet", "csrs", "--port", "27019", "--bind_ip_all", "--dbpath", "/data/db"]
    volumes:
      - configsvr2_data:/data/db
    networks: [minisplunk-net]
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27019", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  configsvr3:
    image: mongo:7.0
    <<: *restart-policy
    command: ["mongod", "--configsvr", "--replSet", "csrs", "--port", "27019", "--bind_ip_all", "--dbpath", "/data/db"]
    volumes:
      - configsvr3_data:/data/db
    networks: [minisplunk-net]
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27019", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  # ---------------------------------------------------------------
  # Shard 1 replica set (shard1rs) - Primary/Secondary/Arbiter
  # ---------------------------------------------------------------
  shard1a:
    image: mongo:7.0
    <<: *restart-policy
    command: ["mongod", "--shardsvr", "--replSet", "shard1rs", "--port", "27018", "--bind_ip_all", "--dbpath", "/data/db"]
    volumes:
      - shard1a_data:/data/db
    networks: [minisplunk-net]
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27018", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  shard1b:
    image: mongo:7.0
    <<: *restart-policy
    command: ["mongod", "--shardsvr", "--replSet", "shard1rs", "--port", "27018", "--bind_ip_all", "--dbpath", "/data/db"]
    volumes:
      - shard1b_data:/data/db
    networks: [minisplunk-net]
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27018", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  shard1c:
    image: mongo:7.0
    <<: *restart-policy
    command: ["mongod", "--shardsvr", "--replSet", "shard1rs", "--port", "27018", "--bind_ip_all", "--dbpath", "/data/db"]
    volumes:
      - shard1c_data:/data/db
    networks: [minisplunk-net]
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27018", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  # ---------------------------------------------------------------
  # Shard 2 replica set (shard2rs) - Primary/Secondary/Arbiter
  # ---------------------------------------------------------------
  shard2a:
    image: mongo:7.0
    <<: *restart-policy
    command: ["mongod", "--shardsvr", "--replSet", "shard2rs", "--port", "27018", "--bind_ip_all", "--dbpath", "/data/db"]
    volumes:
      - shard2a_data:/data/db
    networks: [minisplunk-net]
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27018", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  shard2b:
    image: mongo:7.0
    <<: *restart-policy
    command: ["mongod", "--shardsvr", "--replSet", "shard2rs", "--port", "27018", "--bind_ip_all", "--dbpath", "/data/db"]
    volumes:
      - shard2b_data:/data/db
    networks: [minisplunk-net]
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27018", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  shard2c:
    image: mongo:7.0
    <<: *restart-policy
    command: ["mongod", "--shardsvr", "--replSet", "shard2rs", "--port", "27018", "--bind_ip_all", "--dbpath", "/data/db"]
    volumes:
      - shard2c_data:/data/db
    networks: [minisplunk-net]
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27018", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

# ---------------------------------------------------------------
  # Stage 1: initiate replica sets — runs BEFORE mongos, since mongos
  # can't become healthy until csrs already has an elected primary.
  # ---------------------------------------------------------------
  mongo-init-rs:
    image: mongo:7.0
    restart: "no"
    depends_on:
      configsvr1: {condition: service_healthy}
      configsvr2: {condition: service_healthy}
      configsvr3: {condition: service_healthy}
      shard1a: {condition: service_healthy}
      shard1b: {condition: service_healthy}
      shard1c: {condition: service_healthy}
      shard2a: {condition: service_healthy}
      shard2b: {condition: service_healthy}
      shard2c: {condition: service_healthy}
    volumes:
      - ./init-replicasets.sh:/init-replicasets.sh:ro
    networks: [minisplunk-net]
    entrypoint: ["bash", "/init-replicasets.sh"]

  mongos:
    image: mongo:7.0
    <<: *restart-policy
    command: ["mongos", "--configdb", "csrs/configsvr1:27019,configsvr2:27019,configsvr3:27019", "--port", "27017", "--bind_ip_all"]
    depends_on:
      mongo-init-rs: {condition: service_completed_successfully}
    ports:
      - "${MONGOS_PORT:-27017}:27017"
    networks: [minisplunk-net]
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27017", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  # ---------------------------------------------------------------
  # Stage 2: register shards + shard the collection — runs AFTER
  # mongos is healthy.
  # ---------------------------------------------------------------
  mongo-init-shards:
    image: mongo:7.0
    restart: "no"
    depends_on:
      mongos: {condition: service_healthy}
    volumes:
      - ./init-shards.sh:/init-shards.sh:ro
    networks: [minisplunk-net]
    entrypoint: ["bash", "/init-shards.sh"]
  # ---------------------------------------------------------------
  # RabbitMQ - IPC layer between Gateway and Worker nodes
  # ---------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:3-management
    <<: *restart-policy
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-rabbituser}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-rabbit1234}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    networks: [minisplunk-net]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ---------------------------------------------------------------
  # Gateway / search head
  # ---------------------------------------------------------------
  gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    <<: *restart-policy
    environment:
      GATEWAY_HOST: 0.0.0.0
      GATEWAY_PORT: 8080
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-rabbituser}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-rabbit1234}
      MONGO_URI: mongodb://mongos:27017/mini_splunk
      PURGE_TIMEOUT_SECONDS: ${PURGE_TIMEOUT_SECONDS:-15}
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    depends_on:
      rabbitmq: {condition: service_healthy}
      mongo-init-shards: {condition: service_completed_successfully}
    networks: [minisplunk-net]

 # ---------------------------------------------------------------
  # Worker nodes - scaled on demand, not fixed at 3.
  # Run more/fewer with: docker compose up -d --scale worker=N
  # ---------------------------------------------------------------
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    <<: *restart-policy
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      MONGO_URI: mongodb://mongos:27017/mini_splunk
    depends_on:
      rabbitmq: {condition: service_healthy}
      mongo-init-shards: {condition: service_completed_successfully}
    networks: [minisplunk-net]
    
  # ---------------------------------------------------------------
  # Client - interactive CLI, run on demand (not part of `up`):
  #   docker compose run --rm client
  # ---------------------------------------------------------------
  client:
    build:
      context: .
      dockerfile: Dockerfile.client
    profiles: ["client"]
    stdin_open: true
    tty: true
    volumes:
      - ./sample-logs:/app/sample-logs:ro
    networks: [minisplunk-net]
